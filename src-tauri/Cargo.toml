[package]
name = "toolbox"
version = "0.2.0"
description = "Toolbox desktop app"
authors = ["Toolbox"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
which = "8"
open = "5"
rfd = "0.18"
md-5 = "0.10"
sha2 = "0.10"
croner = "4"
percent-encoding = "2"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 控制 dev 构建产物体积：关闭本地 crate 的增量缓存（incremental 目录会随开发持续增大），
# 并去掉依赖的调试符号（Windows 下 PDB 体积占大头）。需要逐步调试 Rust 时临时改回即可。
[profile.dev]
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

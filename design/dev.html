<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开发工具 · Toolbox 界面优化设计稿</title>
<link rel="stylesheet" href="assets/core.css">
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="assets/components.css">
<style>
  .dev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .dev-grid { grid-template-columns: 1fr; } }
  .tool-out { min-height: 120px; max-height: 320px; overflow: auto; margin-top: 12px; }
  .match-mark { background: var(--warning-soft); color: var(--warning); border-radius: 3px; padding: 0 1px; font-weight: 600; }
  .regex-view { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px; font-size: var(--fs-13); white-space: pre-wrap; word-break: break-all; min-height: 80px; background: var(--surface-soft); }
  .uuid-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .uuid-list .row { justify-content: space-between; }
  .case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .pwd-out { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .pwd-out .mono { flex: 1; font-size: var(--fs-14); word-break: break-all; }
  .ts-live { font-family: var(--font-mono); font-size: var(--fs-16); font-weight: 600; color: var(--primary); }
  .curl-out { max-height: 300px; }
</style>
</head>
<body data-page="dev">
<div class="app-shell">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="page" data-tabs-scope>
      <div class="page-head rise">
        <div>
          <h1><svg class="ic ic-20" viewBox="0 0 24 24"><use href="#i-code"></use></svg>开发工具</h1>
          <p class="sub">前端日常小工具，全部本地处理，不上传。</p>
        </div>
      </div>

      <div class="seg-wrap rise">
        <div class="seg" data-tabs="dev">
          <button class="on" data-tab="json"><svg class="ic" viewBox="0 0 24 24"><use href="#i-braces"></use></svg>JSON 工具</button>
          <button data-tab="codec"><svg class="ic" viewBox="0 0 24 24"><use href="#i-hash"></use></svg>编解码</button>
          <button data-tab="regex"><svg class="ic" viewBox="0 0 24 24"><use href="#i-search"></use></svg>正则测试</button>
          <button data-tab="curl"><svg class="ic" viewBox="0 0 24 24"><use href="#i-terminal"></use></svg>curl 转换</button>
          <button data-tab="assist"><svg class="ic" viewBox="0 0 24 24"><use href="#i-wand"></use></svg>辅助工具</button>
        </div>
      </div>

      <!-- JSON 工具 -->
      <div data-panel="json" class="dev-grid">
        <div class="card">
          <div class="card-head">
            <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24"><use href="#i-braces"></use></svg>输入</h3>
            <div class="row">
              <select class="select" id="json-indent" style="width:100px;height:28px;font-size:13px">
                <option value="2">缩进 2</option><option value="4">缩进 4</option><option value="tab">缩进 Tab</option>
              </select>
              <button class="btn btn-ghost btn-sm" id="json-clear">清空</button>
            </div>
          </div>
          <textarea class="textarea mono" id="json-in" style="min-height:260px">{"name":"Toolbox","version":"0.3.0","features":["translate","download","tasks"],"settings":{"tray":true,"threads":4}}</textarea>
          <div class="row" style="margin-top:12px">
            <button class="btn btn-primary btn-sm" id="json-format">格式化</button>
            <button class="btn btn-outline btn-sm" id="json-minify">压缩</button>
            <button class="btn btn-outline btn-sm" id="json-ts">生成 TS 类型</button>
          </div>
          <div class="alert alert-err" id="json-err" hidden style="margin-top:12px"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24"><use href="#i-file"></use></svg>结果</h3>
            <button class="btn btn-outline btn-sm" data-copy="#json-out"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"></use></svg>复制结果</button>
          </div>
          <pre class="term tool-out" id="json-out" style="margin-top:0">// 点击「格式化」查看结果</pre>
        </div>
      </div>

      <!-- 编解码 -->
      <div data-panel="codec" class="dev-grid" hidden>
        <div class="card">
          <h3 class="card-title" style="margin-bottom:12px"><svg class="ic" viewBox="0 0 24 24"><use href="#i-clock"></use></svg>时间戳</h3>
          <div class="spread"><span class="hint">当前 Unix 时间戳（秒）</span><span class="ts-live" id="ts-now">—</span></div>
          <div class="row" style="margin-top:12px">
            <input class="input grow mono" id="ts-in" placeholder="输入时间戳，如 1763600000">
            <button class="btn btn-outline btn-sm" id="ts-convert">转换</button>
          </div>
          <p class="hint" id="ts-out" style="margin:10px 0 0">支持秒 / 毫秒，自动识别。</p>
        </div>
        <div class="card">
          <div class="card-head">
            <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24"><use href="#i-hash"></use></svg>UUID 生成</h3>
            <button class="btn btn-primary btn-sm" id="uuid-gen">生成 5 个</button>
          </div>
          <div class="uuid-list" id="uuid-list"><p class="hint" style="margin:0">点击生成 v4 UUID，可单独复制。</p></div>
        </div>
        <div class="card">
          <h3 class="card-title" style="margin-bottom:12px"><svg class="ic" viewBox="0 0 24 24"><use href="#i-lock"></use></svg>Base64</h3>
          <textarea class="textarea mono" id="b64-in" style="min-height:72px">桌面工具箱 Toolbox</textarea>
          <div class="row" style="margin-top:10px">
            <button class="btn btn-primary btn-sm" id="b64-enc">编码</button>
            <button class="btn btn-outline btn-sm" id="b64-dec">解码</button>
            <button class="btn btn-ghost btn-sm btn-icon" data-copy="#b64-out" title="复制结果"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"></use></svg></button>
          </div>
          <pre class="term tool-out" id="b64-out" style="min-height:56px">// 结果</pre>
        </div>
        <div class="card">
          <h3 class="card-title" style="margin-bottom:12px"><svg class="ic" viewBox="0 0 24 24"><use href="#i-link"></use></svg>URL 编码</h3>
          <input class="input mono" id="url-in" value="https://example.com/search?q=桌面工具箱&page=1">
          <div class="row" style="margin-top:10px">
            <button class="btn btn-primary btn-sm" id="url-enc">编码</button>
            <button class="btn btn-outline btn-sm" id="url-dec">解码</button>
            <button class="btn btn-ghost btn-sm btn-icon" data-copy="#url-out" title="复制结果"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"></use></svg></button>
          </div>
          <pre class="term tool-out" id="url-out" style="min-height:56px">// 结果</pre>
        </div>
      </div>

      <!-- 正则测试 -->
      <div data-panel="regex" hidden style="margin-top:16px">
        <div class="card">
          <div class="row" style="flex-wrap:wrap">
            <span class="mono muted">/</span>
            <input class="input mono grow" id="re-pattern" value="1[3-9]\d{9}" style="min-width:200px">
            <span class="mono muted">/</span>
            <input class="input mono" id="re-flags" value="g" style="width:64px">
          </div>
          <div class="row" style="margin-top:10px;flex-wrap:wrap">
            <span class="hint">常用预设：</span>
            <button class="chip" data-re="1[3-9]\d{9}">手机号</button>
            <button class="chip" data-re="[\w.+-]+@[\w-]+\.[\w.]+">邮箱</button>
            <button class="chip" data-re="https?://\S+">URL</button>
            <button class="chip" data-re="\d{4}-\d{2}-\d{2}">日期</button>
            <button class="chip" data-re="\b(?:\d{1,3}\.){3}\d{1,3}\b">IPv4</button>
            <button class="chip" data-re="#[0-9a-fA-F]{6}\b">色值</button>
          </div>
          <div class="dev-grid" style="margin-top:14px">
            <div class="field">
              <label>测试文本</label>
              <textarea class="textarea mono" id="re-text" style="min-height:160px">联系人：张三 13812345678，李四 15987654321。
备用邮箱 zhangsan@example.com，服务器 192.168.1.10。
主题色 #4f63e7，发布日期 2026-11-20。</textarea>
            </div>
            <div class="field">
              <label>匹配高亮 <span class="hint" id="re-count"></span></label>
              <div class="regex-view grow" id="re-view"></div>
            </div>
          </div>
          <div class="table-wrap" style="margin-top:14px">
            <table class="tbl">
              <thead><tr><th>#</th><th>匹配内容</th><th>位置</th><th>长度</th></tr></thead>
              <tbody id="re-matches"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- curl 转换 -->
      <div data-panel="curl" hidden style="margin-top:16px">
        <div class="card">
          <div class="card-head">
            <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24"><use href="#i-terminal"></use></svg>curl 命令</h3>
            <div class="seg" id="curl-target">
              <button class="on" data-lang="fetch">fetch</button>
              <button data-lang="axios">axios</button>
              <button data-lang="python">Python</button>
            </div>
          </div>
          <textarea class="textarea mono" id="curl-in" style="min-height:110px">curl -X POST 'https://api.example.com/v1/translate' -H 'Content-Type: application/json' -H 'Authorization: Bearer sk-xxx' -d '{"text":"你好","target":"en"}'</textarea>
          <div class="row" style="margin-top:12px">
            <button class="btn btn-primary btn-sm" id="curl-convert">转换为代码</button>
            <button class="btn btn-outline btn-sm" data-copy="#curl-out">复制结果</button>
          </div>
          <pre class="term tool-out curl-out" id="curl-out">// 点击「转换为代码」查看结果</pre>
        </div>
      </div>

      <!-- 辅助工具 -->
      <div data-panel="assist" class="dev-grid" hidden>
        <div class="card">
          <div class="card-head">
            <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24"><use href="#i-key"></use></svg>随机密码</h3>
            <span class="pill pill-ok" id="pwd-strength">强</span>
          </div>
          <div class="spread"><span class="hint">长度</span><span class="mono" id="pwd-len-val">16</span></div>
          <input class="range" type="range" id="pwd-len" min="8" max="64" value="16">
          <div class="row" style="flex-wrap:wrap;margin-top:8px">
            <label class="check"><input type="checkbox" id="pwd-lower" checked>小写</label>
            <label class="check"><input type="checkbox" id="pwd-upper" checked>大写</label>
            <label class="check"><input type="checkbox" id="pwd-digit" checked>数字</label>
            <label class="check"><input type="checkbox" id="pwd-symbol" checked>符号</label>
            <label class="check"><input type="checkbox" id="pwd-ambiguous">排除易混淆</label>
          </div>
          <div class="pwd-out">
            <span class="mono" id="pwd-out">—</span>
            <button class="btn btn-ghost btn-sm btn-icon" data-copy="#pwd-out" title="复制"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"></use></svg></button>
          </div>
          <button class="btn btn-primary btn-sm" id="pwd-gen" style="margin-top:12px">
            <svg class="ic" viewBox="0 0 24 24"><use href="#i-refresh"></use></svg>重新生成
          </button>
        </div>
        <div class="card">
          <h3 class="card-title" style="margin-bottom:12px"><svg class="ic" viewBox="0 0 24 24"><use href="#i-wand"></use></svg>大小写 / 命名转换</h3>
          <input class="input mono" id="case-in" value="desktop toolbox app">
          <div class="case-grid" id="case-grid"></div>
          <div class="pwd-out">
            <span class="mono" id="case-out">—</span>
            <button class="btn btn-ghost btn-sm btn-icon" data-copy="#case-out" title="复制"><svg class="ic" viewBox="0 0 24 24"><use href="#i-copy"></use></svg></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/shell.js"></script>
<script src="assets/pages/dev.js"></script>
</body>
</html>

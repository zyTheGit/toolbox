# 持续集成：前端类型检查与测试 + 三平台 Rust 编译检查。
# 本地无法交叉编译 macOS/Linux（缺目标系统库），由 CI 兜底。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: 运行 Rust 测试（Linux 诊断：单线程 + 硬超时）
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            cargo test --manifest-path src-tauri/Cargo.toml --no-run
            BIN=$(ls src-tauri/target/debug/build/toolbox/*/out/toolbox_lib-* | head -1)
            echo "测试二进制: $BIN"
            timeout 120 "$BIN" --test-threads=1 > /tmp/single.log 2>&1
            echo "单线程退出码: $?"; tail -5 /tmp/single.log
            timeout 120 "$BIN" --nocapture > /tmp/par.log 2>&1
            echo "并行退出码: $?"; tail -60 /tmp/par.log
          else
            cargo test --manifest-path src-tauri/Cargo.toml
          fi
